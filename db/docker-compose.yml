services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: umpirehat-postgres
    environment:
      POSTGRES_USER: umpirehat
      POSTGRES_PASSWORD: umpirehat_dev
      POSTGRES_DB: umpirehat
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umpirehat -d umpirehat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
